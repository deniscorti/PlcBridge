<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge — Test Client</title>
<script src="https://unpkg.com/uplot@1.6.30/dist/uPlot.iife.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/uplot@1.6.30/dist/uPlot.min.css">
<style>
  :root { --bg: #1a1a2e; --card: #16213e; --accent: #0f3460; --green: #4ecca3; --red: #e74c3c; --yellow: #f39c12; --text: #eee; --muted: #999; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
  h1 { font-size: 1.4rem; margin-bottom: 12px; }
  h2 { font-size: 1rem; color: var(--green); margin-bottom: 8px; }
  button { background: var(--accent); color: var(--text); border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
  button:hover { background: var(--green); color: var(--bg); }
  button.primary { background: var(--green); color: var(--bg); font-weight: 600; }
  input, select { background: var(--card); border: 1px solid var(--accent); color: var(--text); padding: 4px 8px; border-radius: 4px; }
  label.chk { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .status.ok { background: var(--green); } .status.err { background: var(--red); } .status.off { background: var(--muted); }

  .top-bar, .actions, .write-panel { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .top-bar input { width: 280px; }
  .write-panel input { width: 140px; }

  /* ── Channel panel ── */
  .panel { background: var(--card); border-radius: 8px; padding: 14px; margin: 10px 0; }
  .channel-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .channel-actions .info { color: var(--muted); font-size: 0.8rem; margin-left: 8px; }
  .source-group { margin-bottom: 8px; }
  .source-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; cursor: pointer; user-select: none; }
  .source-hdr input { accent-color: var(--green); width: 16px; height: 16px; }
  .source-hdr label { font-weight: 600; font-size: 0.95rem; cursor: pointer; }
  .source-hdr .cnt { color: var(--muted); font-size: 0.8rem; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 2px 10px; padding-left: 24px; }
  .tag-item { display: flex; align-items: center; gap: 3px; font-size: 0.82rem; }
  .tag-item input { accent-color: var(--green); }
  .tag-item .chart-chk { accent-color: var(--yellow); }
  .kind-badge { font-size: 0.65rem; padding: 1px 4px; border-radius: 3px; }
  .kind-badge.telemetry { background: #0f3460; color: var(--green); }
  .kind-badge.event { background: #3d2e00; color: var(--yellow); }
  .kind-badge.alarm { background: #3d0a0a; color: var(--red); }

  /* ── Chart ── */
  #chart-section { display: none; }
  #chart-section.visible { display: block; }
  .chart-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .chart-toolbar select, .chart-toolbar input { font-size: 0.8rem; }
  #chart-container { background: var(--card); border-radius: 8px; padding: 8px; min-height: 300px; }
  #chart-container .uplot { width: 100% !important; }
  .u-legend { font-size: 0.75rem !important; }

  /* ── Logs ── */
  .log-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 800px) { .log-container { grid-template-columns: 1fr; } }
  .log-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .log-hdr button { font-size: 0.7rem; padding: 2px 8px; }
  .log-box { background: var(--card); border-radius: 8px; padding: 10px; max-height: 300px; overflow-y: auto; font-family: 'Cascadia Code', monospace; font-size: 0.75rem; line-height: 1.6; }
  .log-line { color: var(--muted); white-space: pre-wrap; word-break: break-all; }
  .log-line.error { color: var(--red); } .log-line.push { color: var(--green); } .log-line.sent { color: #5dade2; }
  .resp-entry { border-bottom: 1px solid #ffffff08; padding: 2px 0; }
  .resp-id { color: #5dade2; font-weight: 600; }
  .resp-status { padding: 1px 6px; border-radius: 3px; font-size: 0.65rem; font-weight: 600; }
  .resp-status.ok { background: #0a3d2a; color: var(--green); }
  .resp-status.fail { background: #3d0a0a; color: var(--red); }
  .resp-status.pending { background: #3d2e00; color: var(--yellow); }
  .resp-detail { color: var(--muted); font-size: 0.7rem; }

  /* ── Live values grid ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--card); border-radius: 8px; padding: 14px; }
  .tag-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #ffffff10; font-size: 0.85rem; }
  .tag-name { color: var(--muted); }
  .tag-value { font-family: 'Cascadia Code', monospace; }
  .tag-value.telemetry { color: var(--green); }
  .tag-value.event { color: var(--yellow); }
  .tag-value.alarm { color: var(--red); }
</style>
</head>
<body>

<h1>Bridge — Test Client</h1>

<!-- Connection -->
<div class="top-bar">
  <span class="status off" id="ws-status"></span>
  <span id="ws-label">Disconnected</span>
  <input id="bridge-url" placeholder="Bridge URL (e.g. http://localhost:5080)">
  <button onclick="connectWs()">Connect WS</button>
  <button onclick="disconnectWs()">Disconnect</button>
  <button onclick="loadSources()">Load Sources (REST)</button>
</div>

<!-- Quick actions -->
<div class="actions">
  <button onclick="sendSubscribeAll()">Subscribe ALL</button>
  <button onclick="sendUnsubscribeAll()">Unsubscribe ALL</button>
  <button onclick="sendPing()">Ping</button>
  <button onclick="sendGetSources()">getSources</button>
  <button onclick="sendGetStatus()">getStatus</button>
</div>

<!-- Write/Read -->
<div class="write-panel">
  <select id="write-source"></select>
  <input id="write-tag" placeholder="Tag name">
  <input id="write-value" placeholder="Value">
  <button onclick="sendWrite()">Write</button>
  <button onclick="sendRead()">Read</button>
</div>

<!-- Channel selector -->
<div class="panel" id="channel-panel" style="display:none">
  <h2>Channel Selector</h2>
  <div class="channel-actions">
    <button onclick="selAll(true)">Select All</button>
    <button onclick="selAll(false)">Deselect All</button>
    <label class="chk"><input type="checkbox" id="compact-mode"> Compact</label>
    <label class="chk"><input type="checkbox" id="chart-all-chk" onchange="toggleChartAll(this.checked)"> Chart all selected</label>
    <button class="primary" onclick="subscribeSelected()">Subscribe Selected</button>
    <button onclick="unsubscribeSelected()">Unsubscribe Selected</button>
    <span class="info" id="sel-count">0 tags (0 groups)</span>
    <span class="info" id="layout-info"></span>
  </div>
  <div id="channel-groups"></div>
</div>

<!-- Chart section -->
<div id="chart-section">
  <h2>Chart</h2>
  <div class="chart-toolbar">
    <label class="chk">Range:
      <select id="chart-range" onchange="onChartRangeChange()">
        <option value="60">Last 1 min</option>
        <option value="300" selected>Last 5 min</option>
        <option value="900">Last 15 min</option>
        <option value="1800">Last 30 min</option>
        <option value="3600">Last 1 hour</option>
      </select>
    </label>
    <button onclick="loadHistory()">Load History (REST)</button>
    <button onclick="resetZoom()">Reset Zoom</button>
    <label class="chk"><input type="checkbox" id="chart-follow" checked> Auto-follow</label>
    <span class="info" id="chart-info"></span>
  </div>
  <div id="chart-container"></div>
</div>

<!-- Live values -->
<div class="grid" id="sources-grid"></div>

<!-- Logs -->
<div class="log-container">
  <div>
    <div class="log-hdr">
      <h2>Message Log</h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <label class="chk"><input type="checkbox" id="raw-mode" onchange="rawMode=this.checked"> Raw JSON</label>
        <button onclick="clearLog('log')">Clear</button>
      </div>
    </div>
    <div class="log-box" id="log"></div>
  </div>
  <div>
    <div class="log-hdr">
      <h2>Responses</h2>
      <button onclick="clearLog('resp-log')">Clear</button>
    </div>
    <div class="log-box" id="resp-log"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════════════
let ws = null, bridgeUrl = '', wsUrl = '', msgId = 0, rawMode = false;
let knownSources = [];
const pendingReqs = {};
const compactLayouts = {};  // layoutId -> { source, tags[] }

// Chart state
let chart = null;
const chartSeries = [];     // [{ source, tag, idx }]
const chartData = [[]];     // [timestamps, ...values]
const CHART_MAX_POINTS = 4000;
let chartFollowing = true;

// ══════════════════════════════════════════════════════════
//  Init
// ══════════════════════════════════════════════════════════
async function init() {
  try {
    const r = await fetch('/config');
    const cfg = await r.json();
    bridgeUrl = cfg.bridgeUrl;
    wsUrl = cfg.wsUrl;
  } catch {
    bridgeUrl = 'http://localhost:5080';
    wsUrl = 'ws://localhost:5080/ws';
  }
  document.getElementById('bridge-url').value = bridgeUrl;
}

function getBridgeUrl() {
  const v = document.getElementById('bridge-url').value.trim();
  if (v) { bridgeUrl = v; wsUrl = v.replace('http://','ws://').replace('https://','wss://') + '/ws'; }
  return bridgeUrl;
}

// ══════════════════════════════════════════════════════════
//  Logging
// ══════════════════════════════════════════════════════════
function log(text, cls='') {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  d.className = 'log-line ' + cls;
  d.textContent = `[${ts()}] ${text}`;
  el.prepend(d);
  while (el.children.length > 500) el.removeChild(el.lastChild);
}
function respLog(id, status, detail) {
  const el = document.getElementById('resp-log');
  const d = document.createElement('div');
  d.className = 'resp-entry';
  const sc = status==='ok'?'ok':status==='pending'?'pending':'fail';
  const req = pendingReqs[id];
  const op = req?req.op:'?';
  const src = req&&req.source?` [${req.source}]`:'';
  d.innerHTML = `<span class="resp-id">[${ts()}] ${id}</span> <span class="resp-status ${sc}">${status.toUpperCase()}</span> <strong>${op}</strong>${src}<br><span class="resp-detail">${esc(detail)}</span>`;
  el.prepend(d);
  while (el.children.length > 200) el.removeChild(el.lastChild);
}
function clearLog(id) { document.getElementById(id).innerHTML = ''; }
function ts() { return new Date().toISOString().substring(11,23); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ══════════════════════════════════════════════════════════
//  WS send with tracking
// ══════════════════════════════════════════════════════════
function wsSend(obj) {
  if (!ws||ws.readyState!==WebSocket.OPEN) { log('Not connected','error'); return; }
  const j = JSON.stringify(obj);
  ws.send(j);
  log(`-> ${j}`, 'sent');
  if (obj.id) { pendingReqs[obj.id] = { op:obj.op, ts:Date.now(), source:obj.source, tags:obj.tags }; respLog(obj.id,'pending',j); }
}

// ══════════════════════════════════════════════════════════
//  REST
// ══════════════════════════════════════════════════════════
async function loadSources() {
  getBridgeUrl();
  try {
    const r = await fetch(`${bridgeUrl}/api/sources`);
    const data = await r.json();
    log(`REST: ${data.length} source(s)`);
    onSourcesReceived(data);
  } catch(e) { log(`REST error: ${e.message}`,'error'); }
}

function onSourcesReceived(sources) {
  knownSources = sources;
  renderSources(sources);
  updateWriteSelect(sources);
  renderChannelPanel(sources);
}

function renderSources(sources) {
  const g = document.getElementById('sources-grid'); g.innerHTML = '';
  for (const src of sources) {
    const c = document.createElement('div'); c.className='card'; c.id=`card-${src.id}`;
    c.innerHTML = `<h2>${src.id}</h2>` + src.tags.map(t =>
      `<div class="tag-row"><span class="tag-name">${t.name} <small>(${t.kind})</small></span><span class="tag-value ${t.kind.toLowerCase()}" id="tv-${src.id}-${t.name}">—</span></div>`
    ).join('');
    g.appendChild(c);
  }
}
function updateWriteSelect(sources) {
  document.getElementById('write-source').innerHTML = sources.map(s=>`<option value="${s.id}">${s.id}</option>`).join('');
}
function updateTagDisplay(source, tag, value, kind) {
  const el = document.getElementById(`tv-${source}-${tag}`);
  if (!el) return;
  el.textContent = typeof value==='number' ? value.toFixed(3) : JSON.stringify(value);
  el.className = `tag-value ${(kind||'telemetry').toLowerCase()}`;
}

// ══════════════════════════════════════════════════════════
//  Channel panel
// ══════════════════════════════════════════════════════════
function renderChannelPanel(sources) {
  const p = document.getElementById('channel-panel');
  const c = document.getElementById('channel-groups'); c.innerHTML = '';
  if (!sources.length) { p.style.display='none'; return; }
  p.style.display='block';
  for (const src of sources) {
    const g = document.createElement('div'); g.className='source-group';
    const hid = `src-chk-${src.id}`;
    g.innerHTML =
      `<div class="source-hdr"><input type="checkbox" id="${hid}" checked onchange="toggleSrcGrp('${src.id}',this.checked)"><label for="${hid}">${src.id}</label><span class="cnt">(${src.tags.length})</span></div>` +
      `<div class="tag-list" id="tags-${src.id}">` +
        src.tags.map(t => `<label class="tag-item"><input type="checkbox" checked data-source="${src.id}" data-tag="${t.name}" onchange="updateSelCount()"> <input type="checkbox" class="chart-chk" data-source="${src.id}" data-tag="${t.name}" title="Show in chart"> ${t.name} <span class="kind-badge ${t.kind.toLowerCase()}">${t.kind}</span></label>`).join('') +
      `</div>`;
    c.appendChild(g);
  }
  updateSelCount();
}
function toggleSrcGrp(src, ch) {
  document.querySelectorAll(`#tags-${src} input[type="checkbox"]`).forEach(cb=>cb.checked=ch);
  updateSelCount();
}
function selAll(ch) {
  document.querySelectorAll('#channel-groups input[type="checkbox"]').forEach(cb=>cb.checked=ch);
  updateSelCount();
}
function toggleChartAll(ch) {
  document.querySelectorAll('#channel-groups .chart-chk').forEach(cb => {
    // Only toggle chart checkbox for selected tags
    const tagCb = cb.parentElement.querySelector('input[type="checkbox"]:not(.chart-chk)');
    if (tagCb && tagCb.checked) cb.checked = ch;
  });
}
function updateSelCount() {
  const sel = getSelectedBySource();
  let t=0, g=0;
  for (const s in sel) { t+=sel[s].length; g++; }
  document.getElementById('sel-count').textContent = `${t} tag${t!==1?'s':''} (${g} group${g!==1?'s':''})`;
}
function getSelectedBySource() {
  const r = {};
  document.querySelectorAll('#channel-groups .tag-list input[type="checkbox"]:checked:not(.chart-chk)').forEach(cb => {
    const s=cb.dataset.source, t=cb.dataset.tag;
    if (s&&t) { if (!r[s]) r[s]=[]; r[s].push(t); }
  });
  return r;
}
function getChartTags() {
  const r = [];
  document.querySelectorAll('#channel-groups .chart-chk:checked').forEach(cb => {
    r.push({ source: cb.dataset.source, tag: cb.dataset.tag });
  });
  return r;
}

function subscribeSelected() {
  const bySource = getSelectedBySource();
  const keys = Object.keys(bySource);
  if (!keys.length) { log('No tags selected','error'); return; }
  const compact = document.getElementById('compact-mode').checked;
  for (const source of keys) {
    const msg = { op:'subscribe', id:`s${++msgId}`, source, tags:bySource[source] };
    if (compact) msg.compact = true;
    wsSend(msg);
  }
  log(`Sent ${keys.length} subscribe${compact?' (compact)':''}`, 'push');

  // Setup chart for chart-checked tags
  const ct = getChartTags();
  if (ct.length) setupChart(ct);
}
function unsubscribeSelected() {
  const bySource = getSelectedBySource();
  for (const source in bySource) wsSend({ op:'unsubscribe', id:`u${++msgId}`, source });
}

// ══════════════════════════════════════════════════════════
//  WebSocket
// ══════════════════════════════════════════════════════════
function connectWs() {
  getBridgeUrl();
  if (ws&&ws.readyState===WebSocket.OPEN) { log('Already connected'); return; }
  log(`Connecting to ${wsUrl}...`);
  ws = new WebSocket(wsUrl);
  ws.onopen = () => {
    document.getElementById('ws-status').className='status ok';
    document.getElementById('ws-label').textContent='Connected';
    log('WebSocket connected','push');
  };
  ws.onclose = e => {
    document.getElementById('ws-status').className='status err';
    document.getElementById('ws-label').textContent=`Disconnected (${e.code})`;
    log(`WebSocket closed: ${e.code} ${e.reason}`,'error');
  };
  ws.onerror = () => log('WebSocket error','error');
  ws.onmessage = e => {
    try { handleMsg(JSON.parse(e.data), e.data); }
    catch { log(`WS raw: ${e.data}`); }
  };
}
function disconnectWs() {
  if (ws) { ws.close(); ws=null; }
  for (const k in compactLayouts) delete compactLayouts[k];
  updateLayoutInfo();
}

function handleMsg(msg, raw) {
  if (rawMode) log(`<- ${raw}`, 'push');

  // Compact data batch
  if (msg.type === 'd') {
    const ly = compactLayouts[msg.l];
    if (!ly) { if (!rawMode) log(`<- compact layoutId=${msg.l} UNKNOWN`,'error'); return; }
    let n=0;
    for (let i=0; i<msg.v.length; i++) {
      if (msg.v[i]==null) continue;
      updateTagDisplay(ly.source, ly.tags[i], msg.v[i], 'telemetry');
      pushChartValue(ly.source, ly.tags[i], msg.v[i], msg.ts);
      n++;
    }
    if (!rawMode) log(`<- compact [${ly.source}] ${n}/${msg.v.length} vals (m:${msg.m})`,'push');
    return;
  }

  // Layout update
  if (msg.type === 'layoutUpdate') {
    compactLayouts[msg.layoutId] = { source:msg.source, tags:msg.tags };
    if (!rawMode) log(`<- layoutUpdate [${msg.source}] #${msg.layoutId} [${msg.tags.join(',')}]`,'push');
    updateLayoutInfo(); return;
  }

  // Verbose push
  if (msg.type==='telemetry'||msg.type==='event'||msg.type==='alarm') {
    updateTagDisplay(msg.source, msg.tag, msg.value??msg.active, msg.type);
    if (msg.type==='telemetry' && typeof msg.value==='number') pushChartValue(msg.source, msg.tag, msg.value, msg.ts);
    if (!rawMode) log(`<- ${msg.type} ${msg.source}/${msg.tag} = ${JSON.stringify(msg.value??msg.active)} (m:${msg.msgId})`,'push');
    return;
  }

  if (msg.type==='pong') { if (!rawMode) log('<- pong','push'); return; }

  if (msg.type==='response') {
    // getSources
    if (msg.ok && msg.sources && Array.isArray(msg.sources)) {
      onSourcesReceived(msg.sources);
      if (!rawMode) log(`<- getSources: ${msg.sources.length} source(s)`,'push');
      if (msg.id) respLog(msg.id,'ok',`${msg.sources.length} source(s)`);
      return;
    }
    // Read response
    if (msg.ok && msg.id && (msg.value!==undefined || msg.ts!==undefined)) {
      if (!rawMode) log(`<- read [${msg.id}] value=${JSON.stringify(msg.value)} ts=${msg.ts||'-'}`,'push');
      if (msg.id) respLog(msg.id,'ok',`value=${JSON.stringify(msg.value)}`);
      return;
    }
    // Compact subscribe
    if (msg.ok && msg.compact && msg.layout) {
      const ly = msg.layout;
      compactLayouts[ly.layoutId] = { source:ly.source, tags:ly.tags };
      if (!rawMode) log(`<- compact OK [${ly.source}] #${ly.layoutId} ${ly.tags.length} tags`,'push');
      if (msg.id) respLog(msg.id,'ok',`layout#${ly.layoutId}: ${ly.tags.length} tags`);
      updateLayoutInfo(); return;
    }
    const d = JSON.stringify(msg).substring(0,300);
    if (msg.id) respLog(msg.id, msg.ok?'ok':'error', d);
    if (!rawMode) log(`<- response [${msg.id}] ok=${msg.ok} ${d}`, msg.ok?'':'error');
    return;
  }

  if (msg.type==='error') {
    if (!rawMode) log(`<- error [${msg.id||'-'}] ${msg.code}: ${msg.message}`,'error');
    if (msg.id) respLog(msg.id,'error',`${msg.code}: ${msg.message}`);
    return;
  }

  if (!rawMode) log(`<- ${JSON.stringify(msg).substring(0,200)}`);
}

function updateLayoutInfo() {
  const keys = Object.keys(compactLayouts);
  const el = document.getElementById('layout-info');
  if (!keys.length) { el.textContent=''; return; }
  el.textContent = 'Layouts: ' + keys.map(id => `${compactLayouts[id].source}:#${id}(${compactLayouts[id].tags.length})`).join(', ');
}

// ── WS commands ──
function sendSubscribeAll() {
  const msg = { op:'subscribe', id:`s${++msgId}`, tags:['ALL'] };
  if (document.getElementById('compact-mode').checked) msg.compact=true;
  wsSend(msg);
}
function sendUnsubscribeAll() { wsSend({ op:'unsubscribe', id:`u${++msgId}` }); }
function sendPing() { wsSend({ op:'ping' }); }
function sendGetSources() { wsSend({ op:'getSources', id:`gs${++msgId}` }); }
function sendGetStatus() { wsSend({ op:'getStatus', id:`st${++msgId}` }); }
function sendWrite() {
  const source=document.getElementById('write-source').value, tag=document.getElementById('write-tag').value;
  let value=document.getElementById('write-value').value;
  if (!source||!tag) { log('Source and tag required','error'); return; }
  const n=Number(value); if (!isNaN(n)&&value!=='') value=n;
  wsSend({ op:'write', id:`w${++msgId}`, source, tag, value });
}
function sendRead() {
  const source=document.getElementById('write-source').value, tag=document.getElementById('write-tag').value;
  if (!source||!tag) { log('Source and tag required','error'); return; }
  wsSend({ op:'read', id:`r${++msgId}`, source, tag });
}

// ══════════════════════════════════════════════════════════
//  Chart (uPlot)
// ══════════════════════════════════════════════════════════
const COLORS = ['#4ecca3','#5dade2','#f39c12','#e74c3c','#9b59b6','#1abc9c','#e67e22','#3498db','#e84393','#00cec9','#fdcb6e','#6c5ce7','#ff7675','#74b9ff','#a29bfe','#55efc4','#fab1a0','#81ecec','#dfe6e9','#ffeaa7'];

function setupChart(tags) {
  chartSeries.length = 0;
  chartData.length = 0;
  chartData.push([]); // timestamps

  const series = [{ label: 'Time' }];
  tags.forEach((t, i) => {
    chartSeries.push({ source: t.source, tag: t.tag, idx: i+1 });
    chartData.push([]);
    series.push({
      label: `${t.source}/${t.tag}`,
      stroke: COLORS[i % COLORS.length],
      width: 1.5,
    });
  });

  document.getElementById('chart-section').classList.add('visible');
  const container = document.getElementById('chart-container');
  container.innerHTML = '';

  const width = container.clientWidth - 16;
  const opts = {
    width: width,
    height: 320,
    cursor: { drag: { x: true, y: true, uni: 50 } },
    scales: {
      x: { time: true },
    },
    axes: [
      {
        stroke: '#999',
        grid: { stroke: '#ffffff15' },
        ticks: { stroke: '#ffffff15' },
      },
      {
        stroke: '#999',
        grid: { stroke: '#ffffff15' },
        ticks: { stroke: '#ffffff15' },
      },
    ],
    hooks: {
      setSelect: [
        u => {
          // Zoom on drag select
          const min = u.posToVal(u.select.left, 'x');
          const max = u.posToVal(u.select.left + u.select.width, 'x');
          if (max - min > 0.5) {
            u.setScale('x', { min, max });
            chartFollowing = false;
            document.getElementById('chart-follow').checked = false;
          }
          u.setSelect({ left: 0, top: 0, width: 0, height: 0 }, false);
        }
      ],
    },
    series: series,
  };

  chart = new uPlot(opts, chartData, container);

  // Wheel zoom
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = chart.over.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const xVal = chart.posToVal(cx, 'x');
    const [curMin, curMax] = [chart.scales.x.min, chart.scales.x.max];
    const range = curMax - curMin;
    const factor = e.deltaY > 0 ? 1.25 : 0.8;
    const newRange = range * factor;
    const ratio = (xVal - curMin) / range;
    const newMin = xVal - newRange * ratio;
    const newMax = xVal + newRange * (1 - ratio);
    chart.setScale('x', { min: newMin, max: newMax });
    chartFollowing = false;
    document.getElementById('chart-follow').checked = false;
  }, { passive: false });

  // Resize
  const ro = new ResizeObserver(() => { if (chart) chart.setSize({ width: container.clientWidth - 16, height: 320 }); });
  ro.observe(container);

  updateChartInfo();
}

function pushChartValue(source, tag, value, tsStr) {
  if (!chart || !chartSeries.length) return;
  const si = chartSeries.find(s => s.source === source && s.tag === tag);
  if (!si) return;

  const t = tsStr ? new Date(tsStr).getTime() / 1000 : Date.now() / 1000;
  const times = chartData[0];

  // Append timestamp if new or same as last
  if (!times.length || t > times[times.length - 1]) {
    times.push(t);
    for (let i = 1; i < chartData.length; i++) chartData[i].push(null);
  }
  chartData[si.idx][times.length - 1] = value;

  // Trim old points
  while (times.length > CHART_MAX_POINTS) {
    times.shift();
    for (let i = 1; i < chartData.length; i++) chartData[i].shift();
  }

  // Throttle chart updates
  scheduleChartRedraw();
}

let chartRedrawTimer = null;
function scheduleChartRedraw() {
  if (chartRedrawTimer) return;
  chartRedrawTimer = requestAnimationFrame(() => {
    chartRedrawTimer = null;
    if (!chart || !chartData[0].length) return;
    chart.setData(chartData, false);
    if (chartFollowing || document.getElementById('chart-follow').checked) {
      chartFollowing = true;
      const rangeSec = parseInt(document.getElementById('chart-range').value);
      const now = chartData[0][chartData[0].length - 1];
      chart.setScale('x', { min: now - rangeSec, max: now });
    }
    updateChartInfo();
  });
}

function resetZoom() {
  chartFollowing = true;
  document.getElementById('chart-follow').checked = true;
  scheduleChartRedraw();
}
function onChartRangeChange() {
  chartFollowing = true;
  document.getElementById('chart-follow').checked = true;
  scheduleChartRedraw();
}
function updateChartInfo() {
  const pts = chartData[0].length;
  const series = chartSeries.length;
  document.getElementById('chart-info').textContent = `${series} series, ${pts} points`;
}

// ══════════════════════════════════════════════════════════
//  History loader (REST -> chart)
// ══════════════════════════════════════════════════════════
async function loadHistory() {
  if (!chartSeries.length) { log('No chart series configured — subscribe with chart checkboxes first','error'); return; }
  getBridgeUrl();
  const rangeSec = parseInt(document.getElementById('chart-range').value);
  const from = new Date(Date.now() - rangeSec * 1000).toISOString();
  const to = new Date().toISOString();

  // Group chart series by source
  const bySource = {};
  for (const s of chartSeries) {
    if (!bySource[s.source]) bySource[s.source] = [];
    bySource[s.source].push(s);
  }

  let totalPoints = 0;

  for (const source in bySource) {
    const tags = bySource[source].map(s => s.tag).join(',');
    try {
      const url = `${bridgeUrl}/api/sources/${source}/telemetry?tags=${tags}&from=${from}&to=${to}&limit=5000`;
      const r = await fetch(url);
      const resp = await r.json();

      if (!resp.data) continue;

      // resp.data is grouped by tag: [ { tag, values: [{ v, ts, msgId }] } ]
      for (const group of resp.data) {
        const si = chartSeries.find(s => s.source === source && s.tag === group.tag);
        if (!si) continue;

        for (const pt of group.values) {
          const t = new Date(pt.ts).getTime() / 1000;
          const times = chartData[0];

          // Find insert position (data should be sorted)
          let idx = times.length;
          // Check if this timestamp already exists at the end
          if (times.length && Math.abs(times[times.length - 1] - t) < 0.001) {
            idx = times.length - 1;
          } else if (!times.length || t > times[times.length - 1]) {
            times.push(t);
            for (let i = 1; i < chartData.length; i++) chartData[i].push(null);
            idx = times.length - 1;
          } else {
            // Insert in order (binary search)
            let lo = 0, hi = times.length - 1;
            while (lo <= hi) {
              const mid = (lo + hi) >> 1;
              if (times[mid] < t) lo = mid + 1; else hi = mid - 1;
            }
            if (lo < times.length && Math.abs(times[lo] - t) < 0.001) {
              idx = lo;
            } else {
              times.splice(lo, 0, t);
              for (let i = 1; i < chartData.length; i++) chartData[i].splice(lo, 0, null);
              idx = lo;
            }
          }
          chartData[si.idx][idx] = pt.v;
          totalPoints++;
        }
      }

      log(`REST history: ${source} — ${resp.data.length} tag(s), quality=${resp.quality}`, 'push');
    } catch (e) {
      log(`REST history error [${source}]: ${e.message}`, 'error');
    }
  }

  // Trim
  while (chartData[0].length > CHART_MAX_POINTS) {
    chartData[0].shift();
    for (let i = 1; i < chartData.length; i++) chartData[i].shift();
  }

  log(`Loaded ${totalPoints} history points total`, 'push');
  chart.setData(chartData, false);

  // Set view to loaded range
  if (chartData[0].length) {
    const min = chartData[0][0];
    const max = chartData[0][chartData[0].length - 1];
    chart.setScale('x', { min, max });
  }
  updateChartInfo();
}

// ══════════════════════════════════════════════════════════
init();
</script>
